<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="100" height="100" rx="22" fill="#0b1120" stroke="#243560" stroke-width="2"/>
  
  <!-- Monogram Logo MM & Tech Symbol -->
  <g fill="none" stroke="url(#primaryGradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- First 'M' -->
    <path d="M 22 68 L 22 32 L 35 48 L 48 32 L 48 68" />
    <!-- Second 'M' overlay -->
    <path d="M 52 68 L 52 32 L 65 48 L 78 32 L 78 68" />
  </g>

  <!-- Accent Tech Dot -->
  <circle cx="82" cy="70" r="4" fill="#38bdf8" filter="url(#glow)"/>
</svg>
