<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Página Não Encontrada | Mailson Maia Alves</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .not-found-container {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      gap: 1.5rem;
    }
    .not-found-code {
      font-size: 6rem;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
      text-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
    }
    .not-found-title {
      font-size: 2rem;
      color: var(--text-main);
    }
    .not-found-desc {
      color: var(--text-muted);
      max-width: 480px;
    }
  </style>
</head>
<body>
  <main class="not-found-container">
    <div class="not-found-code">404</div>
    <h1 class="not-found-title">Página Não Encontrada</h1>
    <p class="not-found-desc">O recurso solicitado não existe ou foi movido. Retorne à página principal para explorar projetos e serviços.</p>
    <a href="https://mailsonm.github.io/" class="btn btn-primary">
      <span>Voltar ao Início</span>
    </a>
  </main>
</body>
</html>
